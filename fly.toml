# Конфигурация приложения на Fly.io.
# Имя должно быть уникальным в пределах всей платформы.
app = "voice-helper-bot"

# Ближайший к СНГ регион — Варшава.
primary_region = "waw"

# Сборка образа из Dockerfile в корне репозитория.
[build]

# Минимум одна машина всегда запущена — бот не «засыпает».
min_machines_running = 1

# Параметры машины (бот лёгкий, 256 MB хватает).
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# Команда запуска процесса бота.
# [http_service] намеренно отсутствует: бот работает по polling и не слушает HTTP.
[processes]
  app = "python -m bot.main"